name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 9 */3 * *"  # every 3 days at 9am UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping app
        run: |
          curl -sL --max-time 60 \
            -H "User-Agent: Mozilla/5.0 (compatible; WakeBot/1.0)" \
            -o /dev/null -w "HTTP %{http_code}\n" \
            https://earnings-call-intelligence-pjain.streamlit.app/ || true

      - name: Push keep-alive commit
        run: |
          echo "Last wake: $(date -u '+%Y-%m-%d %H:%M UTC')" > .streamlit-keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .streamlit-keepalive
          git commit -m "chore: keep Streamlit app alive [skip ci]"
          git push
